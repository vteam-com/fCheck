name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    name: Build, test, and self-check (100%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate version file
        run: ./tool/generate_version.sh

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze lib test --no-pub

      - name: Tests
        run: flutter test --reporter=compact --no-pub

      - name: Run fcheck against itself (strict + JSON)
        run: dart run ./bin/fcheck.dart --strict --json --exclude "**/example" . > fcheck-report.json

      - name: Upload fcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcheck-report
          path: fcheck-report.json

      - name: Add score summary
        if: always()
        run: |
          echo "### fcheck self-check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Enforcement: \`--strict\` (fails when score < 100%)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required score: \`100%\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify PR when score gate fails
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## fcheck CI gate failed',
              '',
              `Required compliance score: **100%**`,
              'fcheck strict gate failed (score was below 100% or an internal error occurred).',
              '',
              'Download the `fcheck-report` artifact for details.'
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
